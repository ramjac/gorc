name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          ext=""
          if [ "${GOOS}" = "windows" ]; then
            ext=".exe"
          fi
          out="gorc-${version}-${GOOS}-${GOARCH}${ext}"
          go build -trimpath -ldflags "-s -w -X github.com/ramjac/gorc/internal/app.Version=${version}" -o "${out}" ./cmd/gorc
          archive="gorc-${version}-${GOOS}-${GOARCH}"
          if [ "${GOOS}" = "windows" ]; then
            zip "${archive}.zip" "${out}"
            echo "ASSET=${archive}.zip" >> "$GITHUB_ENV"
          else
            tar -czf "${archive}.tar.gz" "${out}"
            echo "ASSET=${archive}.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          # Each artifact was downloaded into its own directory named after
          # the artifact (which matches the asset filename), so move each
          # file up one level into a flat dist/ layout, then drop the now-
          # empty per-artifact directories.
          for dir in */; do
            mv "${dir%/}"/* .
            rmdir "${dir%/}"
          done
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/*
